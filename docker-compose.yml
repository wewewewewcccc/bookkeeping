services:
  mysql:
    image: mysql:8.4
    container_name: bookkeeping-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "13306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u${MYSQL_USER}", "-p${MYSQL_PASSWORD}"]
      interval: 5s
      timeout: 3s
      retries: 20

  ollama:
    image: ollama/ollama:latest
    container_name: bookkeeping-ollama
    restart: unless-stopped
    volumes:
      - ollama_models:/root/.ollama
    # CPU only，8G 内存机器不需要 GPU 配置

  web:
    build: ./backend
    container_name: bookkeeping-web
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DATABASE_URL: mysql+pymysql://${MYSQL_USER}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE}?charset=utf8mb4
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5vl:3b}
      IMAGE_DIR: /data/images
      ACCESS_CODE: ${ACCESS_CODE:-1}
    ports:
      - "6640:8000"
    volumes:
      - ./data/images:/data/images

volumes:
  mysql_data:
  ollama_models:
